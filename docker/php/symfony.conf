# public/ : le seul dossier accessible depuis l'extérieur (le navigateur) 
# Dedans il y a index.php, la porte d'entrée de toutes la pages
# Si l'adresse demandée n'est pas un vrai fichier, Apache la donne a Symfony (index.php)
<Directory /var/www/html/public>
    AllowOverride None
    FallBackResource /index.php
</Directory>