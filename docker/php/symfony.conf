# public/ : le seul dossier accessible depuis le navigateur 
# Dedans il y a index.php, la porte d'entrée de toutes la pages
# Ce dossier dit à Apache : Si le fichier demandé n'existe pas, il passe à index.php, Symfony ne connait pas cette route -> 404

# <Directory> ... </Directory> encadre les règles d’un dossier.
# ici les regles s'applicquent à public/
<Directory /var/www/html/public>
    AllowOverride None
    FallBackResource /index.php
</Directory>