
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
    # 3310 : port de mon pc (pas 3306 car wamp l'utilise)-> 3306 port de MariaDB dans le conteneur
      - "3310:3306"
###< doctrine/doctrine-bundle ###
  mongodb:
    ports: 
      - "27017:27017"

  phpmyadmin:
    ports:
    # phpmyamdin s'ouvrira sur localhost:8080
      - "8080:80"

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
